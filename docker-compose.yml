# Base de datos PostgreSQL para desarrollo local.
# Levantar con: npm run db:up  (o docker compose up -d)
services:
  db:
    image: postgres:16-alpine
    container_name: truequeutn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trueque
      POSTGRES_PASSWORD: trueque
      POSTGRES_DB: truequeutn
    ports:
      - '5432:5432'
    volumes:
      - truequeutn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trueque -d truequeutn']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truequeutn-db-data:
